# ═══ PUBLICATION AUTOMATIQUE ═══
# À chaque envoi sur GitHub, le dossier « 5 - Site web » est mis en
# ligne sur GitHub Pages. Rien d'autre ne part : ni les archives,
# ni les projets, ni les documents de travail.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "5 - Site web"
      - id: deploiement
        uses: actions/deploy-pages@v4
